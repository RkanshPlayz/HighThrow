<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HighThrow | Smash Bottles</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #06060e;
            --panel-bg: rgba(13, 13, 26, 0.95);
            --neon-purple: #bc13fe;
            --neon-cyan: #00f5ff;
            --neon-green: #39ff14;
            --neon-pink: #ff007f;
            --neon-gold: #ffb703;
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Persistent Profile & Wallet Status Bar */
        #profile-header {
            position: fixed;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(18, 18, 38, 0.85);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 245, 255, 0.3);
            backdrop-filter: blur(10px);
            z-index: 2000;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
        }
        .stat-badge.coins { color: var(--neon-gold); }
        .stat-badge.stars { color: #ffd166; }

        #profile-header i.edit-btn {
            cursor: pointer;
            color: var(--neon-cyan);
            transition: transform 0.2s;
        }
        #profile-header i.edit-btn:hover { transform: scale(1.2); }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background: var(--bg-dark);
            z-index: 10;
        }

        .hidden { display: none !important; }

        .modal-box {
            background: var(--panel-bg);
            border: 2px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.35);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            width: 85%;
            max-width: 360px;
        }

        .modal-box h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            margin-top: 0;
            letter-spacing: 1px;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-family: 'Rajdhani', sans-serif;
            outline: none;
        }

        .menu-btn {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #7a04eb, #bc13fe);
            border: 1px solid var(--neon-purple);
            color: white;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(188, 19, 254, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .menu-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 22px var(--neon-purple);
        }

        .menu-btn.btn-cyan {
            background: linear-gradient(135deg, #0077b6, #00f5ff);
            border-color: var(--neon-cyan);
            box-shadow: 0 4px 15px rgba(0, 245, 255, 0.4);
        }

        /* Fixed Responsive Main Menu Title */
        #menu-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 9.5vw, 3.4rem);
            max-width: 90vw;
            text-align: center;
            text-shadow: 0 0 15px var(--neon-purple), 0 0 30px var(--neon-pink);
            margin: 0 0 35px 0;
            letter-spacing: 2px;
            font-weight: 900;
            word-break: break-word;
        }

        .menu-button-cluster {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 210px;
        }

        .credits-text {
            position: absolute;
            bottom: 18px;
            left: 18px;
            font-size: 0.8rem;
            opacity: 0.6;
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
        }

        /* Map UI */
        #map-screen {
            justify-content: flex-start;
            overflow-y: scroll;
            padding: 75px 0 95px 0;
            -webkit-overflow-scrolling: touch;
        }

        .map-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            font-size: 1.6rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .map-path-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column-reverse;
            gap: 30px;
            padding: 0 25px;
            box-sizing: border-box;
        }

        .level-node {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: #111124;
            border: 2px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .level-node.pos-left { align-self: flex-start; left: 20px; }
        .level-node.pos-center { align-self: center; }
        .level-node.pos-right { align-self: flex-end; right: 20px; }

        .level-node.unlocked {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 14px rgba(0, 245, 255, 0.35);
            background: #091e2f;
        }

        .level-node.current {
            border-color: var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
            background: #0a2d17;
            animation: pulse-node 1.5s infinite;
        }

        @keyframes pulse-node {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .level-node.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .node-stars {
            display: flex;
            gap: 2px;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 2px;
        }

        .node-stars i.earned {
            color: var(--neon-gold);
            text-shadow: 0 0 4px var(--neon-gold);
        }

        .back-floating-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(18, 18, 36, 0.9);
            border: 1.5px solid var(--neon-purple);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            font-size: 1.15rem;
            transition: transform 0.2s;
        }
        .back-floating-btn:hover { transform: scale(1.1); }

        /* Shop Tabs & Container */
        .shop-container {
            width: 92%;
            max-width: 450px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 18px;
            padding: 18px;
            box-sizing: border-box;
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.25);
            max-height: 80vh;
            overflow-y: auto;
        }

        .shop-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .shop-tab-btn {
            flex: 1;
            padding: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .shop-tab-btn.active {
            background: linear-gradient(135deg, #0077b6, #00f5ff);
            color: black;
            font-weight: bold;
            border-color: var(--neon-cyan);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .skin-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
        }

        .skin-card.selected {
            border-color: var(--neon-green);
            background: rgba(57, 255, 20, 0.08);
            box-shadow: 0 0 14px rgba(57, 255, 20, 0.3);
        }

        .skin-preview {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            margin-bottom: 2px;
        }

        .skin-title { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: bold; }
        .skin-req { font-size: 0.75rem; opacity: 0.75; }

        .skin-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            padding: 6px 10px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.2s;
        }

        .skin-btn.buy { background: var(--neon-gold); color: black; }
        .skin-btn.equip { background: var(--neon-cyan); color: black; }
        .skin-btn.equipped { background: var(--neon-green); color: black; cursor: default; }

        /* Leaderboard */
        .leaderboard-container {
            width: 90%;
            max-width: 400px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-purple);
            border-radius: 18px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.25);
        }

        .leaderboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(188, 19, 254, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .leaderboard-header h2 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            color: var(--neon-pink);
            font-size: 1.3rem;
        }

        .leaderboard-actions { display: flex; gap: 14px; }
        .leaderboard-actions i { cursor: pointer; font-size: 1.15rem; transition: color 0.2s; }
        .leaderboard-actions i:hover { color: var(--neon-cyan); }

        .leaderboard-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 4px solid var(--neon-cyan);
            font-size: 0.9rem;
        }

        /* In-Game HUD (No Profile overlap) */
        #game-screen { background: #04040a; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }

        .game-hud {
            position: absolute;
            top: 14px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
            pointer-events: none;
            z-index: 100;
        }

        .hud-item {
            background: rgba(10, 10, 25, 0.8);
            padding: 5px 12px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-nav-controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
            z-index: 2500;
        }

        .game-nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(18, 18, 36, 0.9);
            border: 1.5px solid var(--neon-cyan);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            font-size: 1.1rem;
            transition: transform 0.2s;
        }
        .game-nav-btn:hover { transform: scale(1.1); }

        /* Level Clear Overlay */
        #level-clear-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 4000;
        }

        .star-reward-display {
            font-size: 2.2rem;
            display: flex;
            gap: 10px;
            margin: 12px 0;
            color: rgba(255,255,255,0.2);
        }

        .star-reward-display i.active {
            color: var(--neon-gold);
            text-shadow: 0 0 15px var(--neon-gold);
        }
    </style>
</head>
<body>

    <!-- Header (Hidden during Game) -->
    <div id="profile-header" class="hidden">
        <span id="player-username-display">Player</span>
        <i class="fa-solid fa-user-pen edit-btn" onclick="triggerRename()" title="Edit Name"></i>
        <div class="stat-badge coins">
            <i class="fa-solid fa-coins"></i>
            <span id="player-coins-display">0</span>
        </div>
        <div class="stat-badge stars">
            <i class="fa-solid fa-star"></i>
            <span id="player-stars-display">0</span>
        </div>
    </div>

    <!-- 1. ONBOARDING -->
    <div id="onboarding-screen" class="screen">
        <div class="modal-box">
            <h2>HIGHTHROW</h2>
            <p style="opacity: 0.8; margin-bottom: 20px; font-size: 1rem;">Enter handle to launch game</p>
            <input type="text" id="username-input" placeholder="Player Name..." maxlength="15">
            <button class="menu-btn" onclick="saveNewProfile()">START GAME</button>
        </div>
    </div>

    <!-- 2. MAIN MENU -->
    <div id="menu-screen" class="screen hidden">
        <h1>HIGHTHROW</h1>
        <div class="menu-button-cluster">
            <button class="menu-btn btn-cyan" onclick="switchScreen('map-screen')"><i class="fa-solid fa-play"></i> PLAY</button>
            <button class="menu-btn" onclick="openShop()"><i class="fa-solid fa-bag-shopping"></i> SHOP & PERKS</button>
            <button class="menu-btn" onclick="openLeaderboard()"><i class="fa-solid fa-trophy"></i> RANKINGS</button>
        </div>
        <div class="credits-text">MADE BY RKANSHPLAYZ</div>
    </div>

    <!-- 3. SHOP & PERKS -->
    <div id="shop-screen" class="screen hidden">
        <div class="shop-container">
            <div class="shop-tabs">
                <button class="shop-tab-btn active" id="tab-skins-btn" onclick="switchShopTab('skins')">BALL SKINS</button>
                <button class="shop-tab-btn" id="tab-perks-btn" onclick="switchShopTab('perks')">PERKS & BOOSTS</button>
            </div>
            <div id="shop-items-target"></div>
        </div>
        <div class="back-floating-btn" onclick="switchScreen('menu-screen')"><i class="fa-solid fa-house"></i></div>
    </div>

    <!-- 4. MAP SCREEN -->
    <div id="map-screen" class="screen hidden">
        <div class="map-title">LEVEL SELECT</div>
        <div class="map-path-container" id="map-nodes-target"></div>
        <div class="back-floating-btn" onclick="switchScreen('menu-screen')"><i class="fa-solid fa-house"></i></div>
    </div>

    <!-- 5. LEADERBOARD SCREEN -->
    <div id="leaderboard-screen" class="screen hidden">
        <div class="leaderboard-container">
            <div class="leaderboard-header">
                <h2>LEADERBOARD</h2>
                <div class="leaderboard-actions">
                    <i class="fa-solid fa-arrows-rotate" onclick="refreshLeaderboardRowsUI(true)" title="Refresh Standings"></i>
                    <i class="fa-solid fa-share-nodes" onclick="shareLeaderboardRank()" title="Share Link"></i>
                </div>
            </div>
            <div class="leaderboard-list" id="leaderboard-rows-target"></div>
        </div>
        <div class="back-floating-btn" onclick="switchScreen('menu-screen')"><i class="fa-solid fa-house"></i></div>
    </div>

    <!-- 6. GAME SCREEN -->
    <div id="game-screen" class="screen hidden">
        <div class="game-hud">
            <div class="hud-item" style="color: var(--neon-cyan);" id="hud-level-text">Level - 1</div>
            <div class="hud-item" style="color: var(--neon-gold);" id="hud-throws-text">THROWS: 0 / 3</div>
            <div class="hud-item" style="color: var(--neon-pink);" id="hud-score-text">SMASHED: 0 / 3</div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div class="game-nav-controls">
            <div class="game-nav-btn" onclick="exitGameDirect('menu-screen')" title="Home"><i class="fa-solid fa-house"></i></div>
            <div class="game-nav-btn" onclick="exitGameDirect('map-screen')" title="Level Select"><i class="fa-solid fa-map"></i></div>
        </div>
    </div>

    <!-- 7. LEVEL CLEAR OVERLAY -->
    <div id="level-clear-overlay" class="hidden">
        <div class="modal-box">
            <h2 id="overlay-status-title">Level - 1 CLEARED!</h2>
            <div class="star-reward-display" id="overlay-stars-container">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
            </div>
            <p id="overlay-detail-text" style="font-size: 1.05rem; margin: 10px 0 18px 0;">Rewards Earned!</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="menu-btn" id="overlay-primary-btn" onclick="handleOverlayNextLevel()">NEXT LEVEL</button>
                <button class="menu-btn btn-cyan" onclick="handleOverlayRetry()">REPLAY</button>
                <button class="menu-btn" style="background:#222; border-color:#444;" onclick="handleOverlayExitMap()">LEVEL SELECT</button>
            </div>
        </div>
    </div>

    <script>
        // Sound Synthesis (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'launch') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(360, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'glass') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1400 + Math.random()*600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.22);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }
        }

        // Expanded Skins (Coins, Stars & Level Milestones)
        const SKINS = [
            { id: 'neon_purple', name: 'Neon Purple', color: '#bc13fe', glow: '#bc13fe', costType: 'free', price: 0 },
            { id: 'cyan_blaze', name: 'Cyber Pulse', color: '#00f5ff', glow: '#00f5ff', costType: 'coins', price: 15 },
            { id: 'fire_storm', name: 'Fire Storm', color: '#ff3300', glow: '#ff7700', costType: 'coins', price: 30 },
            { id: 'toxic_slime', name: 'Acid Slime', color: '#39ff14', glow: '#39ff14', costType: 'stars', price: 5 },
            { id: 'gold_glory', name: 'Golden Sun', color: '#ffd700', glow: '#ffb703', costType: 'coins', price: 60 },
            { id: 'cosmic_star', name: 'Cosmic Star', color: '#ffd166', glow: '#ff9e00', costType: 'stars', price: 15 },
            { id: 'hyper_pink', name: 'Hyper Pink', color: '#ff007f', glow: '#ff007f', costType: 'coins', price: 90 },
            { id: 'void_black', name: 'Void Phantom', color: '#9d4edd', glow: '#7b2cbf', costType: 'stars', price: 25 },
            { id: 'matrix_hacker', name: 'Matrix Pulse', color: '#00ff66', glow: '#00cc44', costType: 'level', reqLvl: 10 }
        ];

        // Purchasable Perks
        const PERKS = [
            { id: 'long_aim', name: 'Extended Aim Arc', desc: 'Predicts longer projectile flight line', costType: 'coins', price: 40 },
            { id: 'extra_throw', name: 'Bonus Throw', desc: 'Grants +1 Extra throw on every single level', costType: 'stars', price: 12 },
            { id: 'heavy_ball', name: 'Heavy Impact', desc: 'Smashes cleanly through obstacles', costType: 'coins', price: 75 }
        ];

        // Fresh Reset Global Leaderboard Standings
        const COMMUNITY_LEADERBOARD = [
            { name: "PVPERS_Leader", score: 85 },
            { name: "NeonStriker", score: 62 },
            { name: "AimMaster99", score: 45 },
            { name: "BottleHunter", score: 25 },
            { name: "VelocityThrow", score: 10 }
        ];

        // Profile State Store
        let profile = {
            name: "",
            highestLevel: 1,
            coins: 0,
            equippedSkin: 'neon_purple',
            unlockedSkins: ['neon_purple'],
            unlockedPerks: [],
            stars: {}
        };

        let currentActiveLevel = 1;
        let lastPlayedLevel = 1;
        let activeShopTab = 'skins';

        // Physics State
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let gameLoopId = null;

        let projectile = { x: 100, y: 0, radius: 12, vx: 0, vy: 0, isThrown: false, isAiming: false };
        let slingAnchor = { startX: 100, startY: 0, currentX: 100, currentY: 0 };
        let bottles = [];
        let obstacles = [];
        let particles = [];

        let currentLevelThrows = 0;
        let maxAllowedThrows = 3;
        let smashedBottlesCount = 0;
        let levelIsDone = false;

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedProfileData();
            resizeGameCanvas();
        });

        function loadSavedProfileData() {
            const saved = localStorage.getItem('highthrow_unified_data') || 
                          localStorage.getItem('highthrow_profile_v2') || 
                          localStorage.getItem('highthrow_profile');

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    profile.name = parsed.name || "Player";
                    profile.highestLevel = Math.max(1, parsed.highestLevel || 1);
                    profile.coins = parsed.coins || 0;
                    profile.equippedSkin = parsed.equippedSkin || 'neon_purple';
                    profile.unlockedSkins = parsed.unlockedSkins || ['neon_purple'];
                    profile.unlockedPerks = parsed.unlockedPerks || [];
                    profile.stars = parsed.stars || {};
                    lastPlayedLevel = profile.highestLevel;
                    saveProfileStorage();
                    switchScreen('menu-screen');
                    return;
                } catch(e) {
                    console.error("Profile load error", e);
                }
            }
            switchScreen('onboarding-screen');
        }

        window.addEventListener('resize', resizeGameCanvas);
        function resizeGameCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            slingAnchor.startX = Math.max(70, canvas.width * 0.15);
            slingAnchor.startY = canvas.height * 0.72;
            if (!projectile.isThrown && !projectile.isAiming) {
                resetProjectilePosition();
            }
        }

        function getTotalStars() {
            return Object.values(profile.stars).reduce((sum, s) => sum + s, 0);
        }

        function updateProfileBar() {
            document.getElementById('player-username-display').innerText = profile.name;
            document.getElementById('player-coins-display').innerText = profile.coins;
            document.getElementById('player-stars-display').innerText = getTotalStars();
        }

        function saveProfileStorage() {
            localStorage.setItem('highthrow_unified_data', JSON.stringify(profile));
            updateProfileBar();
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(scr => scr.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');

            const profileHeader = document.getElementById('profile-header');
            if (screenId === 'menu-screen' || screenId === 'map-screen' || screenId === 'shop-screen') {
                profileHeader.classList.remove('hidden');
                updateProfileBar();
            } else {
                profileHeader.classList.add('hidden');
            }

            if (screenId === 'map-screen') renderLevelMap();
            else if (screenId === 'shop-screen') renderShopUI();
            else if (screenId !== 'game-screen') stopCoreGameLoop();
        }

        function saveNewProfile() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) return alert("Please enter a valid player name!");
            profile.name = input;
            profile.highestLevel = 1;
            profile.coins = 0;
            saveProfileStorage();
            switchScreen('menu-screen');
        }

        function triggerRename() {
            const newName = prompt("Enter your new player name:", profile.name);
            if (newName && newName.trim()) {
                profile.name = newName.trim();
                saveProfileStorage();
            }
        }

        // Harder Level Scaling Formulas
        function getLevelRequirements(lvl) {
            const numBottles = Math.min(8, 3 + Math.floor(lvl / 8));
            let maxThrows = Math.max(2, Math.min(6, Math.ceil(numBottles * 0.65) + 1));
            
            // Extra Throw Perk Check
            if (profile.unlockedPerks.includes('extra_throw')) {
                maxThrows += 1;
            }
            return { numBottles, maxThrows };
        }

        // Map View: Automatically jumps to previous / active level
        function renderLevelMap() {
            const container = document.getElementById('map-nodes-target');
            container.innerHTML = "";

            for (let i = 1; i <= 100; i++) {
                const node = document.createElement('div');
                node.className = 'level-node';
                node.id = `map-node-${i}`;

                if (i % 4 === 1) node.classList.add('pos-left');
                else if (i % 4 === 3) node.classList.add('pos-right');
                else node.classList.add('pos-center');

                const isUnlocked = i === 1 || (profile.highestLevel >= i);

                if (isUnlocked) {
                    node.classList.add('unlocked');
                    if (i === lastPlayedLevel) node.classList.add('current');

                    const starsEarned = profile.stars[i] || 0;
                    node.innerHTML = `
                        <span>${i}</span>
                        <div class="node-stars">
                            <i class="fa-solid fa-star ${starsEarned >= 1 ? 'earned' : ''}"></i>
                            <i class="fa-solid fa-star ${starsEarned >= 2 ? 'earned' : ''}"></i>
                            <i class="fa-solid fa-star ${starsEarned >= 3 ? 'earned' : ''}"></i>
                        </div>
                    `;
                    node.onclick = () => launchLevel(i);
                } else {
                    node.classList.add('locked');
                    node.innerHTML = `<i class="fa-solid fa-lock" style="font-size:0.85rem;"></i>`;
                }
                container.appendChild(node);
            }

            // Smooth scroll to previously played/active level
            setTimeout(() => {
                const targetNode = document.getElementById(`map-node-${lastPlayedLevel}`) || document.querySelector('.level-node.unlocked');
                if (targetNode) targetNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        // Shop System
        function openShop() { switchScreen('shop-screen'); }

        function switchShopTab(tab) {
            activeShopTab = tab;
            document.getElementById('tab-skins-btn').classList.toggle('active', tab === 'skins');
            document.getElementById('tab-perks-btn').classList.toggle('active', tab === 'perks');
            renderShopUI();
        }

        function renderShopUI() {
            const target = document.getElementById('shop-items-target');
            target.innerHTML = "";

            const totalStars = getTotalStars();

            if (activeShopTab === 'skins') {
                const grid = document.createElement('div');
                grid.className = 'shop-grid';

                SKINS.forEach(skin => {
                    const isOwned = profile.unlockedSkins.includes(skin.id);
                    const isEquipped = profile.equippedSkin === skin.id;
                    const canUnlockByLevel = skin.costType === 'level' && profile.highestLevel >= skin.reqLvl;

                    if (canUnlockByLevel && !isOwned) {
                        profile.unlockedSkins.push(skin.id);
                        saveProfileStorage();
                    }

                    const card = document.createElement('div');
                    card.className = `skin-card ${isEquipped ? 'selected' : ''}`;
                    
                    let btnHtml = "";
                    if (isEquipped) {
                        btnHtml = `<button class="skin-btn equipped">EQUIPPED</button>`;
                    } else if (isOwned || canUnlockByLevel) {
                        btnHtml = `<button class="skin-btn equip" onclick="equipSkin('${skin.id}')">EQUIP</button>`;
                    } else if (skin.costType === 'coins') {
                        btnHtml = `<button class="skin-btn buy" onclick="buySkin('${skin.id}', 'coins', ${skin.price})"><i class="fa-solid fa-coins"></i> ${skin.price}</button>`;
                    } else if (skin.costType === 'stars') {
                        btnHtml = `<button class="skin-btn buy" style="background:#ffd166;" onclick="buySkin('${skin.id}', 'stars', ${skin.price})"><i class="fa-solid fa-star"></i> ${skin.price}</button>`;
                    } else if (skin.costType === 'level') {
                        btnHtml = `<button class="skin-btn" style="background:#444; color:#aaa; cursor:not-allowed;">LVL ${skin.reqLvl} REQ</button>`;
                    }

                    let reqDesc = 'Default';
                    if (skin.costType === 'coins') reqDesc = `${skin.price} Coins`;
                    else if (skin.costType === 'stars') reqDesc = `${skin.price} Stars Req`;
                    else if (skin.costType === 'level') reqDesc = `Reach Lvl ${skin.reqLvl}`;

                    card.innerHTML = `
                        <div class="skin-preview" style="background: radial-gradient(circle, ${skin.color}, #000); box-shadow: 0 0 12px ${skin.glow};"></div>
                        <div class="skin-title">${skin.name}</div>
                        <div class="skin-req">${reqDesc}</div>
                        ${btnHtml}
                    `;
                    grid.appendChild(card);
                });
                target.appendChild(grid);
            } else {
                // Perks Tab
                const list = document.createElement('div');
                list.style.display = 'flex';
                list.style.flexDirection = 'column';
                list.style.gap = '10px';

                PERKS.forEach(perk => {
                    const isOwned = profile.unlockedPerks.includes(perk.id);
                    const row = document.createElement('div');
                    row.className = 'leaderboard-row';
                    row.style.flexDirection = 'column';
                    row.style.alignItems = 'flex-start';
                    row.style.gap = '6px';
                    row.style.borderColor = isOwned ? 'var(--neon-green)' : 'var(--neon-purple)';

                    let costTag = perk.costType === 'coins' ? `<i class="fa-solid fa-coins"></i> ${perk.price} Coins` : `<i class="fa-solid fa-star"></i> ${perk.price} Stars`;
                    let btn = isOwned 
                        ? `<button class="skin-btn equipped" style="width:auto; padding:6px 14px;">ACTIVE</button>`
                        : `<button class="skin-btn buy" style="width:auto; padding:6px 14px; background:${perk.costType==='stars'?'#ffd166':'var(--neon-gold)'};" onclick="buyPerk('${perk.id}', '${perk.costType}', ${perk.price})">BUY (${costTag})</button>`;

                    row.innerHTML = `
                        <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                            <strong style="font-family:'Orbitron',sans-serif; color:var(--neon-cyan);">${perk.name}</strong>
                            ${btn}
                        </div>
                        <div style="font-size:0.8rem; opacity:0.8;">${perk.desc}</div>
                    `;
                    list.appendChild(row);
                });
                target.appendChild(list);
            }
        }

        function equipSkin(skinId) {
            profile.equippedSkin = skinId;
            saveProfileStorage();
            renderShopUI();
        }

        function buySkin(skinId, costType, price) {
            if (costType === 'coins') {
                if (profile.coins >= price) {
                    profile.coins -= price;
                    profile.unlockedSkins.push(skinId);
                    profile.equippedSkin = skinId;
                    saveProfileStorage();
                    renderShopUI();
                } else {
                    alert(`Need ${price - profile.coins} more coins!`);
                }
            } else if (costType === 'stars') {
                const totalStars = getTotalStars();
                if (totalStars >= price) {
                    profile.unlockedSkins.push(skinId);
                    profile.equippedSkin = skinId;
                    saveProfileStorage();
                    renderShopUI();
                } else {
                    alert(`Need ${price - totalStars} more total stars!`);
                }
            }
        }

        function buyPerk(perkId, costType, price) {
            if (costType === 'coins') {
                if (profile.coins >= price) {
                    profile.coins -= price;
                    profile.unlockedPerks.push(perkId);
                    saveProfileStorage();
                    renderShopUI();
                } else {
                    alert(`Need ${price - profile.coins} more coins!`);
                }
            } else if (costType === 'stars') {
                const totalStars = getTotalStars();
                if (totalStars >= price) {
                    profile.unlockedPerks.push(perkId);
                    saveProfileStorage();
                    renderShopUI();
                } else {
                    alert(`Need ${price - totalStars} more total stars!`);
                }
            }
        }

        function openLeaderboard() {
            switchScreen('leaderboard-screen');
            refreshLeaderboardRowsUI(false);
        }

        function refreshLeaderboardRowsUI(showNotify) {
            const list = document.getElementById('leaderboard-rows-target');
            list.innerHTML = "";

            let composite = [...COMMUNITY_LEADERBOARD];
            const idx = composite.findIndex(p => p.name === profile.name);
            if (idx >= 0) composite[idx].score = profile.highestLevel;
            else composite.push({ name: profile.name, score: profile.highestLevel });

            composite.sort((a,b) => b.score - a.score);

            composite.forEach((row, i) => {
                const div = document.createElement('div');
                div.className = "leaderboard-row";
                if (row.name === profile.name) div.style.borderColor = "var(--neon-green)";
                div.innerHTML = `<span>#${i+1} ${row.name}</span><strong>Level - ${row.score}</strong>`;
                list.appendChild(div);
            });

            if (showNotify) alert("Leaderboard synced successfully!");
        }

        function shareLeaderboardRank() {
            navigator.clipboard.writeText(window.location.href);
            alert("HighThrow link copied to clipboard!");
        }

        // Gameplay Initialization
        function launchLevel(lvlNum) {
            currentActiveLevel = lvlNum;
            lastPlayedLevel = lvlNum;
            document.getElementById('level-clear-overlay').classList.add('hidden');
            switchScreen('game-screen');

            const reqs = getLevelRequirements(lvlNum);
            currentLevelThrows = 0;
            maxAllowedThrows = reqs.maxThrows;
            smashedBottlesCount = 0;
            levelIsDone = false;

            document.getElementById('hud-level-text').innerText = `Level - ${lvlNum}`;
            document.getElementById('hud-throws-text').innerText = `THROWS: ${currentLevelThrows} / ${maxAllowedThrows}`;
            document.getElementById('hud-score-text').innerText = `SMASHED: 0 / ${reqs.numBottles}`;

            resetProjectilePosition();
            buildLevelScene(lvlNum, reqs.numBottles);

            canvas.onpointerdown = handlePointerDown;
            canvas.onpointermove = handlePointerMove;
            canvas.onpointerup = handlePointerUp;

            stopCoreGameLoop();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function buildLevelScene(lvl, numBottles) {
            bottles = [];
            obstacles = [];
            particles = [];

            const bottleWidth = 28;
            const bottleHeight = 65;
            const startX = canvas.width * 0.45;
            const availableW = canvas.width * 0.48;
            const spacing = availableW / numBottles;

            for (let i = 0; i < numBottles; i++) {
                const waveOffset = Math.sin(i * 1.5 + lvl) * (canvas.height * 0.12);
                const baseY = (canvas.height * 0.35) + waveOffset;
                
                bottles.push({
                    x: startX + (i * spacing),
                    y: Math.max(canvas.height * 0.15, Math.min(canvas.height * 0.58, baseY)),
                    width: bottleWidth,
                    height: bottleHeight,
                    isSmashed: false,
                    speedY: lvl >= 4 ? (0.7 + (lvl * 0.04)) * (i % 2 === 0 ? 1 : -1) : 0,
                    minY: canvas.height * 0.12,
                    maxY: canvas.height * 0.62,
                    colorHue: (i * 45 + lvl * 18) % 360
                });
            }

            // Moving and narrow obstacles for hard levels
            if (lvl >= 6) {
                obstacles.push({
                    x: canvas.width * 0.38,
                    y: canvas.height * 0.25,
                    width: 22,
                    height: canvas.height * 0.28,
                    speedY: lvl >= 10 ? 2.2 : 0,
                    minY: canvas.height * 0.15,
                    maxY: canvas.height * 0.55,
                    dir: 1
                });
            }
        }

        function resetProjectilePosition() {
            projectile.x = slingAnchor.startX;
            projectile.y = slingAnchor.startY;
            projectile.vx = 0;
            projectile.vy = 0;
            projectile.isThrown = false;
            projectile.isAiming = false;
        }

        function handlePointerDown(e) {
            if (projectile.isThrown || levelIsDone) return;
            const dist = Math.hypot(e.clientX - projectile.x, e.clientY - projectile.y);
            if (dist < 55) {
                projectile.isAiming = true;
                slingAnchor.currentX = e.clientX;
                slingAnchor.currentY = e.clientY;
            }
        }

        function handlePointerMove(e) {
            if (!projectile.isAiming) return;
            const angle = Math.atan2(e.clientY - slingAnchor.startY, e.clientX - slingAnchor.startX);
            const dist = Math.min(95, Math.hypot(e.clientX - slingAnchor.startX, e.clientY - slingAnchor.startY));

            slingAnchor.currentX = slingAnchor.startX + Math.cos(angle) * dist;
            slingAnchor.currentY = slingAnchor.startY + Math.sin(angle) * dist;

            projectile.x = slingAnchor.currentX;
            projectile.y = slingAnchor.currentY;
        }

        function handlePointerUp() {
            if (!projectile.isAiming) return;
            projectile.isAiming = false;
            projectile.isThrown = true;

            const pullDist = Math.hypot(slingAnchor.startX - slingAnchor.currentX, slingAnchor.startY - slingAnchor.currentY);
            if (pullDist > 15) {
                projectile.vx = (slingAnchor.startX - slingAnchor.currentX) * 0.23;
                projectile.vy = (slingAnchor.startY - slingAnchor.currentY) * 0.23;
                currentLevelThrows++;
                document.getElementById('hud-throws-text').innerText = `THROWS: ${currentLevelThrows} / ${maxAllowedThrows}`;
                playSfx('launch');
            } else {
                resetProjectilePosition();
            }
        }

        function spawnGlassParticles(x, y, hue) {
            for (let i = 0; i < 22; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                particles.push({
                    x: x + 14,
                    y: y + 30,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    size: 3 + Math.random() * 4,
                    hue: hue,
                    alpha: 1,
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 12
                });
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const activeSkin = SKINS.find(s => s.id === profile.equippedSkin) || SKINS[0];

            // Trajectory Aiming Arc (Extended with Long Aim Perk)
            if (projectile.isAiming) {
                ctx.beginPath();
                ctx.strokeStyle = "rgba(0, 245, 255, 0.45)";
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 8]);

                let trajX = projectile.x;
                let trajY = projectile.y;
                let trajVx = (slingAnchor.startX - slingAnchor.currentX) * 0.23;
                let trajVy = (slingAnchor.startY - slingAnchor.currentY) * 0.23;

                ctx.moveTo(trajX, trajY);
                const steps = profile.unlockedPerks.includes('long_aim') ? 50 : 30;
                for (let step = 0; step < steps; step++) {
                    trajX += trajVx;
                    trajY += trajVy;
                    trajVy += 0.32;
                    ctx.lineTo(trajX, trajY);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Slingshot Bands
            ctx.beginPath();
            ctx.strokeStyle = "rgba(188, 19, 254, 0.7)";
            ctx.lineWidth = 5;
            ctx.moveTo(slingAnchor.startX - 18, slingAnchor.startY);
            ctx.lineTo(projectile.x, projectile.y);
            ctx.moveTo(slingAnchor.startX + 18, slingAnchor.startY);
            ctx.lineTo(projectile.x, projectile.y);
            ctx.stroke();

            // Obstacles
            obstacles.forEach(obs => {
                if (obs.speedY !== 0) {
                    obs.y += obs.speedY * obs.dir;
                    if (obs.y < obs.minY || obs.y > obs.maxY) obs.dir *= -1;
                }

                ctx.fillStyle = "rgba(40, 50, 80, 0.85)";
                ctx.strokeStyle = "var(--neon-cyan)";
                ctx.lineWidth = 2;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                if (projectile.isThrown &&
                    projectile.x + projectile.radius > obs.x &&
                    projectile.x - projectile.radius < obs.x + obs.width &&
                    projectile.y + projectile.radius > obs.y &&
                    projectile.y - projectile.radius < obs.y + obs.height) {
                    
                    // Heavy Ball Perk pushes past obstacles without reversing violently
                    if (profile.unlockedPerks.includes('heavy_ball')) {
                        projectile.vx *= -0.3;
                    } else {
                        projectile.vx *= -0.8;
                    }
                }
            });

            // Bottles
            let activeBottles = 0;
            bottles.forEach(b => {
                if (!b.isSmashed) {
                    activeBottles++;
                    if (b.speedY !== 0) {
                        b.y += b.speedY;
                        if (b.y < b.minY || b.y > b.maxY) b.speedY *= -1;
                    }

                    drawRealisticBottle(ctx, b.x, b.y, b.width, b.height, b.colorHue);

                    if (projectile.isThrown &&
                        projectile.x + projectile.radius > b.x &&
                        projectile.x - projectile.radius < b.x + b.width &&
                        projectile.y + projectile.radius > b.y &&
                        projectile.y - projectile.radius < b.y + b.height) {
                        
                        b.isSmashed = true;
                        smashedBottlesCount++;
                        spawnGlassParticles(b.x, b.y, b.colorHue);
                        playSfx('glass');
                        document.getElementById('hud-score-text').innerText = `SMASHED: ${smashedBottlesCount} / ${bottles.length}`;
                    }
                }
            });

            // Glass Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.25;
                p.alpha -= 0.02;
                p.rot += p.rotSpeed;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rot * Math.PI) / 180);
                ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${p.alpha})`;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();
            }

            // Projectile Ball
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = activeSkin.color;
            ctx.shadowColor = activeSkin.glow;
            ctx.shadowBlur = 15;
            ctx.arc(projectile.x, projectile.y, projectile.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
            ctx.restore();

            if (projectile.isThrown) {
                projectile.x += projectile.vx;
                projectile.y += projectile.vy;
                projectile.vy += 0.32;

                if (projectile.y > canvas.height + 60 || projectile.x > canvas.width + 60 || projectile.x < -60) {
                    if (activeBottles > 0 && currentLevelThrows >= maxAllowedThrows) {
                        finishLevel(false);
                    } else {
                        resetProjectilePosition();
                    }
                }
            }

            if (activeBottles === 0 && !levelIsDone) {
                finishLevel(true);
            }

            if (!levelIsDone) {
                gameLoopId = requestAnimationFrame(gameLoop);
            }
        }

        function drawRealisticBottle(ctx, x, y, w, h, hue) {
            ctx.save();
            ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
            ctx.shadowBlur = 10;
            ctx.strokeStyle = `hsl(${hue}, 100%, 75%)`;
            ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.25)`;
            ctx.lineWidth = 2;

            const neckW = w * 0.4;
            const neckH = h * 0.3;

            ctx.beginPath();
            ctx.fillStyle = "#c29b38";
            ctx.fillRect(x + (w - neckW)/2, y, neckW, 5);

            ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.25)`;
            ctx.moveTo(x + (w - neckW)/2, y + 5);
            ctx.lineTo(x + (w + neckW)/2, y + 5);
            ctx.lineTo(x + (w + neckW)/2, y + neckH);
            ctx.lineTo(x + w, y + neckH + 10);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x, y + neckH + 10);
            ctx.lineTo(x + (w - neckW)/2, y + neckH);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(x + 4, y + neckH + 12);
            ctx.lineTo(x + 4, y + h - 5);
            ctx.stroke();

            ctx.restore();
        }

        // Star-Scaled Coin Rewards: 3 Stars = 5 Coins, 2 Stars = 3 Coins, 1 Star = 1 Coin
        function finishLevel(isWin) {
            levelIsDone = true;
            stopCoreGameLoop();

            const overlay = document.getElementById('level-clear-overlay');
            const title = document.getElementById('overlay-status-title');
            const detail = document.getElementById('overlay-detail-text');
            const starsBox = document.getElementById('overlay-stars-container');
            const primaryBtn = document.getElementById('overlay-primary-btn');

            overlay.classList.remove('hidden');

            if (isWin) {
                playSfx('win');
                title.innerText = `Level - ${currentActiveLevel} CLEARED!`;
                title.style.color = "var(--neon-green)";
                primaryBtn.style.display = "block";

                let starsEarned = 1;
                if (currentLevelThrows === 1 || currentLevelThrows <= Math.ceil(maxAllowedThrows * 0.45)) starsEarned = 3;
                else if (currentLevelThrows <= Math.ceil(maxAllowedThrows * 0.8)) starsEarned = 2;

                const prevStars = profile.stars[currentActiveLevel] || 0;
                if (starsEarned > prevStars) profile.stars[currentActiveLevel] = starsEarned;

                // Scaled Coin Payout
                let earnedCoins = 1;
                if (starsEarned === 3) earnedCoins = 5;
                else if (starsEarned === 2) earnedCoins = 3;
                else earnedCoins = 1;

                profile.coins += earnedCoins;

                if (currentActiveLevel === profile.highestLevel && profile.highestLevel < 100) {
                    profile.highestLevel++;
                }

                saveProfileStorage();

                starsBox.innerHTML = `
                    <i class="fa-solid fa-star ${starsEarned >= 1 ? 'active' : ''}"></i>
                    <i class="fa-solid fa-star ${starsEarned >= 2 ? 'active' : ''}"></i>
                    <i class="fa-solid fa-star ${starsEarned >= 3 ? 'active' : ''}"></i>
                `;
                detail.innerText = `Earned ${starsEarned} Star(s) & +${earnedCoins} Coin(s)!`;
            } else {
                title.innerText = "OUT OF THROWS!";
                title.style.color = "var(--neon-pink)";
                primaryBtn.style.display = "none";
                starsBox.innerHTML = `
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                `;
                detail.innerText = `Target missed! Try again using fewer throws.`;
            }
        }

        function handleOverlayNextLevel() { launchLevel(currentActiveLevel + 1); }
        function handleOverlayRetry() { launchLevel(currentActiveLevel); }
        function handleOverlayExitMap() {
            document.getElementById('level-clear-overlay').classList.add('hidden');
            switchScreen('map-screen');
        }

        function exitGameDirect(targetScreen) {
            document.getElementById('level-clear-overlay').classList.add('hidden');
            stopCoreGameLoop();
            switchScreen(targetScreen);
        }

        function stopCoreGameLoop() {
            if (gameLoopId) {
                cancelAnimationFrame(gameLoopId);
                gameLoopId = null;
            }
        }
    </script>
</body>
</html>
